# RL Training Configuration for Piper Arm

# Random seed for reproducibility
seed: 42

# Logging configuration
log_dir: logs/rl
checkpoint_dir: checkpoints/rl

# Environment configuration
environment:
  urdf_path: assets/piper.urdf
  task: reaching
  simulation_freq: 500.0

  # Task-specific configuration
  task_config:
    max_episode_steps: 500
    target_tolerance: 0.05
    reward_scale: 1.0
    success_reward: 1.0
    failure_reward: 0.0
    step_penalty: 0.01

# RL Training configuration
rl:
  # Algorithm selection: ppo, sac, ddpg, td3
  algorithm: ppo

  # Learning parameters
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 2048
  num_epochs: 10
  max_episode_steps: 500

  # Exploration configuration
  exploration_fraction: 0.1
  final_epsilon: 0.01
  entropy_coefficient: 0.0  # Entropy bonus for exploration

  # Convergence monitoring
  convergence_window: 20
  convergence_threshold: 0.95
  patience: 50
  target_return: 1.0

  # Checkpoint configuration
  checkpoint_dir: checkpoints/rl
  log_dir: logs/rl

  # Policy network architecture (MLP)
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: "relu"
    use_sde: false

# Training loop configuration
training:
  total_timesteps: 100000
  save_interval: 10000
  eval_interval: 5000
  eval_episodes: 10

# Warmstart configuration (optional)
# If il_checkpoint_path is provided during training, IL policy weights
# will be loaded to initialize the RL policy
warmstart:
  enabled: false
  il_checkpoint_path: null
  freeze_layers: false
  num_layers_to_unfreeze: null
